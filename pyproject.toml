[project]
name = "open-reg-auto"
version = "0.1.0"
description = "Standalone OpenAI register protocol extractor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
  "curl-cffi>=0.15.0",
]

[project.scripts]
open-reg-auto = "open_reg_auto.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
